name: Feature Request
description: Suggest a new feature or improvement
labels: [ "enhancement" ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for suggesting an improvement to OpenCS2!

- type: textarea
  id: problem
  attributes:
    label: Problem / Motivation
    description: What problem does this feature solve? What is your use case?
  validations:
    required: true

- type: textarea
  id: solution
  attributes:
    label: Proposed Solution
    description: Describe the feature you'd like to see implemented.
  validations:
    required: true

- type: textarea
  id: alternatives
  attributes:
    label: Alternatives Considered
    description: Any alternative approaches or workarounds you have tried?

- type: textarea
  id: additional
  attributes:
    label: Additional Context
    description: Screenshots, mockups, links to similar implementations, etc.

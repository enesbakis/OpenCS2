name: Bug Report
description: Report a bug or unexpected behaviour
labels: [ "bug", "triage" ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report a bug!
      Please fill in as much detail as possible.

- type: textarea
  id: description
  attributes:
    label: Description
    description: A clear and concise description of the bug.
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
    description: Step-by-step instructions to reproduce the issue.
    placeholder: |
      1. Go to '...'
      2. Click on '...'
      3. See error
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behaviour
    description: What did you expect to happen?
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Behaviour
    description: What actually happened? Include error messages / screenshots if possible.
  validations:
    required: true

- type: textarea
  id: environment
  attributes:
    label: Environment
    description: |
      - Docker version (`docker --version`)
      - OS / distro
      - OpenCS2 version or commit hash
    placeholder: |
      - Docker: 24.0.7
      - OS: Ubuntu 22.04
      - OpenCS2: v1.0.0
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: Relevant Logs
    description: Output of `docker compose logs panel` (paste here or link to a Gist)
    render: shell
